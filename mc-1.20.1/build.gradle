plugins { id 'fabric-loom' version '1.10.5' }
version = '0.5.1+mc1.20.1'
group = 'eff.minecraft'
base { archivesName = 'eff-minecraft-runtime-1.20.1' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version':project.version } }

// Bundle only the existing game runtime, never manuscripts, profiles or model weights.
tasks.register('storyBundle', Zip) {
 archiveFileName = 'eff-story-runtime.zip'
 destinationDirectory = layout.buildDirectory.dir('generated/story')
 preserveFileTimestamps = false
 reproducibleFileOrder = true
 from('../mc-version/bridge') { into 'bridge'; include '*.cjs' }
 from('../pixel-version') { into 'pixel-version'; include '*.js', 'index.html' }
 from('../local-version') { into 'local-version'; include '*.js' }
 from('../desktop') { into 'desktop'; include 'model-client.cjs' }
}
processResources { dependsOn 'storyBundle'; from(tasks.named('storyBundle').map { it.archiveFile }) }

loom {
 mixin { defaultRefmapName = "eff-1201-refmap.json" }
 runs {
  client {
   if (project.hasProperty('effResearchpreview')) { vmArg '-Deff.preview=true'; vmArg '-Deff.previewResearch=true' }
   if (project.hasProperty('effResearchtest')) { vmArg '-Deff.researchSelftest=true' }
   if (project.hasProperty('effRunDir')) { runDir project.relativePath(file(project.property('effRunDir').toString())) }
   if (project.hasProperty('effPreview')) { vmArg '-Deff.preview=true' }
   if (project.hasProperty('effSelftest')) { vmArg '-Deff.selftest=true' }
   if (project.hasProperty('effKeepPreview')) { vmArg '-Deff.keepPreview=true' }
   programArg '--username'; programArg 'EFF_Traveler'
   programArg '--width'; programArg '1280'
   programArg '--height'; programArg '720'
  }
 }
}

tasks.register('bridgeTest', Exec) {
 workingDir file('../mc-version')
 commandLine 'node', '--test', 'tests/bridge.test.cjs', 'tests/research.test.cjs'
}
check { dependsOn 'bridgeTest' }

sourceSets {
 researchCheck {
  java.srcDir 'src/researchCheck/java'
  compileClasspath += sourceSets.main.output
  runtimeClasspath += sourceSets.main.output
 }
}
tasks.register('researchJavaTest', JavaExec) {
 dependsOn researchCheckClasses
 classpath = sourceSets.researchCheck.runtimeClasspath
 mainClass = 'eff.minecraft.ResearchProgramCheck'
}
check { dependsOn 'researchJavaTest' }

// A normal MC shutdown has exit code zero even when the opt-in harness fails.
// Treat the fresh native receipt as the test result instead of reporting a false Gradle success.
def nativeQaStartedAt = 0L
tasks.named('runClient').configure {
 doFirst { nativeQaStartedAt = System.currentTimeMillis() }
 doLast {
  def research = project.hasProperty('effResearchtest')
  if (research || project.hasProperty('effSelftest')) {
   def runPath = project.hasProperty('effRunDir') ? file(project.property('effRunDir')) : file('run')
   def receipt = new File(runPath, research ? 'eff-research-qa/result.json' : 'eff-qa/result.json')
   if (!receipt.isFile() || receipt.lastModified() < nativeQaStartedAt) {
    throw new GradleException('No fresh native QA result: ' + receipt)
   }
   def result = new groovy.json.JsonSlurper().parse(receipt, 'UTF-8')
   if (result.ok != true) throw new GradleException('Native QA failed: ' + result.error)
   logger.lifecycle('Native QA passed: ' + result.checks.size() + ' checks')
  }
 }
}


// The replacement workers have no Minecraft classes or native hooks in their classpath.
sourceSets {
 runtimeKernel {
  java.srcDirs = ['src/runtime/java', 'src/main/java']
  java.include 'eff/runtime/**', 'eff/minecraft/ResearchProgram.java', 'eff/minecraft/Jsons.java'
 }
}
configurations { runtimeKernelImplementation }
dependencies { runtimeKernelImplementation 'com.google.code.gson:gson:2.10' }
tasks.register('runtimeKernelJar', Jar) {
 dependsOn runtimeKernelClasses
 archiveFileName = 'eff-runtime-workers.jar'
 destinationDirectory = layout.buildDirectory.dir('runtime')
 duplicatesStrategy = DuplicatesStrategy.EXCLUDE
 from sourceSets.runtimeKernel.output
 from('runtime/GSON-LICENSE.txt') { into 'META-INF/licenses/gson' }
 from { configurations.runtimeKernelRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
 exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
 preserveFileTimestamps = false; reproducibleFileOrder = true
}
tasks.register('managedRuntimeTest', Exec) {
 dependsOn runtimeKernelJar
 environment 'EFF_TEST_JAVA', javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
 environment 'EFF_TEST_WORKERS', tasks.named('runtimeKernelJar').get().archiveFile.get().asFile.absolutePath
 commandLine 'node', '--test', 'runtime/controller.test.cjs'
}
check { dependsOn managedRuntimeTest }
// Export the fixed Loom launch configuration; no access tokens or paths go into tracked files.
tasks.register('exportManagedLaunch') {
 dependsOn runtimeKernelJar
 dependsOn { def t=tasks.named('runClient').get(); t.taskDependencies.getDependencies(t) }
 doLast {
  def run = tasks.named('runClient').get()
  def directory = project.hasProperty('effManagedDir') ? file(project.property('effManagedDir')) : file('run-managed')
  directory.mkdirs()
  def game = new File(directory, 'mc-host'); game.mkdirs()
  run.useArgFile.set(false)
  def args = new ArrayList<String>(run.allJvmArgs)
  args.addAll(run.jvmArguments.get())
  def lowMemory = !project.hasProperty('effLowMemory') || project.property('effLowMemory').toString().toBoolean()
  args.removeAll { it.startsWith('-Xms') || it.startsWith('-Xmx') }
  if(lowMemory) {
   args.removeAll { it in ['-XX:+UseG1GC','-XX:+UseParallelGC'] || it.startsWith('-XX:ReservedCodeCacheSize=') || it.startsWith('-XX:ActiveProcessorCount=') }
   args += ['-Xms64m','-Xmx768m','-XX:+UseSerialGC','-XX:ReservedCodeCacheSize=64m','-XX:ActiveProcessorCount=2','-XX:MaxDirectMemorySize=128m']
  } else args += ['-Xms128m','-Xmx2G']
  args += ['-XX:+DisableAttachMechanism', '-XX:+ExitOnOutOfMemoryError', '-Deff.lowMemory='+lowMemory, '-Deff.preview=true', '-Deff.previewResearch=true']
  if(project.hasProperty('effManagedTest')) args += '-Deff.managedSelftest=true'
  if(project.hasProperty('effGuardedTest')) args += '-Deff.guardedSelftest=true'
  if(project.hasProperty('effGuardedFallbackTest')) args += '-Deff.guardedAllowFallback=true'
  args += ['-cp', run.internalClasspath.asPath, run.mainClass.get()]
  args += run.args
  run.argumentProviders.each { args.addAll(it.asArguments()) }
  def command = javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
  def config = [java:command, workerJar:tasks.named('runtimeKernelJar').get().archiveFile.get().asFile.absolutePath,
    directory:new File(directory,'authority').absolutePath,
    host:[command:command,args:args,cwd:game.absolutePath,env:run.internalEnvironmentVars.get(),useArgFile:true]]
  def target = new File(directory,'private-launch.json')
  target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)), 'UTF-8')
  logger.lifecycle('Managed launch manifest: ' + target)
 }
}


// Code and ledger protection is Windows-specific; ordinary Fabric builds remain cross-platform.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
 tasks.register('guardianBuild', Exec) {
  def exe = layout.buildDirectory.file('guard/eff-guard.exe')
  inputs.files('runtime/guard/WindowsGuard.cs', 'runtime/guard/WindowsGuard.exe.config')
  outputs.file(exe)
  outputs.file(layout.buildDirectory.file('guard/eff-guard.exe.config'))
  doFirst { exe.get().asFile.parentFile.mkdirs() }
  commandLine new File(System.getenv('SystemRoot'), 'Microsoft.NET/Framework64/v4.0.30319/csc.exe').absolutePath,
    '/nologo', '/platform:x64', '/target:exe', '/r:System.Web.Extensions.dll', '/r:System.Security.dll',
    '/out:' + exe.get().asFile.absolutePath, file('runtime/guard/WindowsGuard.cs').absolutePath
  doLast { copy { from 'runtime/guard/WindowsGuard.exe.config'; into exe.get().asFile.parentFile; rename { 'eff-guard.exe.config' } } }
 }
 tasks.register('guardianTest', Exec) {
  dependsOn guardianBuild, runtimeKernelJar
  environment 'EFF_TEST_JAVA', javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
  environment 'EFF_TEST_WORKERS', tasks.named('runtimeKernelJar').get().archiveFile.get().asFile.absolutePath
  environment 'EFF_TEST_GUARD', layout.buildDirectory.file('guard/eff-guard.exe').get().asFile.absolutePath
  commandLine 'node', '--test', 'runtime/guard/guard.test.cjs'
 }
 check { dependsOn guardianTest }
}
